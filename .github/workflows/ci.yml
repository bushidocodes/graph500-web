name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Unit tests (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run unit tests
        run: make test

  build:
    name: WASM build (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
      - name: Verify emcc
        run: emcc -v
      - name: Build all algorithms
        run: make build
