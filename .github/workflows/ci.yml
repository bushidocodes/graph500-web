name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: make test

  build:
    name: WASM build (emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
      - name: Verify emcc
        run: emcc -v
      - name: Build all algorithms
        run: make build


  sanitizers:
    name: Unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install clang
        run: sudo apt-get update -qq && sudo apt-get install -y clang
      - name: Test under ASan+UBSan
        env:
          CC: clang
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall
          LDFLAGS: -fsanitize=address,undefined
        run: make clean && make test
